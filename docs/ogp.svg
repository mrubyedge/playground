<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">mruby/edge Playground — Try Ruby at the edge</title>
  <desc id="description">Social preview for the mruby/edge browser playground powered by WebAssembly.</desc>

  <defs>
    <radialGradient id="ruby-glow" cx="100%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#dc2b3a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#dc2b3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rust-glow" cx="0%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#c8582c" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#c8582c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="workbench-clip">
      <rect x="702" y="102" width="424" height="402" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f8f5f0"/>
  <rect width="1200" height="630" fill="url(#ruby-glow)"/>
  <rect width="1200" height="630" fill="url(#rust-glow)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(72 47)">
      <path fill="#17141f" d="M21 10h26c6.1 0 11 4.9 11 11v26c0 6.1-4.9 11-11 11H13c-1.7 0-3-1.3-3-3V21c0-6.1 4.9-11 11-11Z"/>
      <path fill="#dc2b3a" d="M15 4h26c6.1 0 11 4.9 11 11v26c0 6.1-4.9 11-11 11H7c-1.7 0-3-1.3-3-3V15C4 8.9 8.9 4 15 4Z"/>
      <path fill="#fff" d="M29.5 18h5.5l-4.6 24h-5.5Z"/>
    </g>
    <text x="144" y="88" fill="#17141f" font-size="30" font-weight="700" letter-spacing="-1">mruby/edge</text>
    <text x="320" y="86" fill="#9e1625" font-size="13" font-weight="700" letter-spacing="2">PLAYGROUND</text>

    <text x="72" y="175" fill="#9e1625" font-size="16" font-weight="700" letter-spacing="3">MRUBY-COMPATIBLE · IN-BROWSER · WEBASSEMBLY</text>
    <text x="68" y="289" fill="#17141f" font-size="82" font-weight="700" letter-spacing="-5">Try Ruby at</text>
    <text x="68" y="381" fill="#dc2b3a" font-size="82" font-weight="700" letter-spacing="-5">the edge.</text>

    <text x="72" y="447" fill="#4d4854" font-size="23">Compile and run Ruby entirely in your browser</text>
    <text x="72" y="481" fill="#4d4854" font-size="23">with <tspan fill="#17141f" font-weight="700">mruby/edge</tspan><tspan> and WebAssembly.</tspan></text>
    <text x="72" y="570" fill="#17141f" font-size="21" font-weight="700">mrubyedge.github.io/playground</text>

    <rect x="724" y="124" width="424" height="402" rx="18" fill="#dc2b3a"/>
    <g transform="rotate(1 914 304)">
      <rect x="702" y="102" width="424" height="402" rx="18" fill="#fffdf9" stroke="#17141f" stroke-width="3"/>
      <g clip-path="url(#workbench-clip)">
        <rect x="702" y="102" width="424" height="82" fill="#fffdf9"/>
        <text x="727" y="133" fill="#9e1625" font-size="10" font-weight="700" letter-spacing="1.8">MRUBY/EDGE PLAYGROUND</text>
        <text x="727" y="162" fill="#17141f" font-size="23" font-weight="700">Ruby editor</text>
        <rect x="1018" y="125" width="82" height="36" rx="8" fill="#dc2b3a"/>
        <text x="1059" y="148" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">RUN CODE</text>
        <line x1="702" y1="184" x2="1126" y2="184" stroke="#17141f" stroke-width="3"/>

        <rect x="702" y="184" width="229" height="320" fill="#fffdf9"/>
        <text x="725" y="214" fill="#17141f" font-size="12" font-weight="700">Ruby code</text>
        <rect x="723" y="230" width="187" height="210" rx="10" fill="#211d29"/>
        <text x="742" y="265" fill="#f8f3ed" font-family="Menlo, Consolas, monospace" font-size="12">puts 'Hello, mruby!'</text>
        <text x="742" y="292" fill="#f8f3ed" font-family="Menlo, Consolas, monospace" font-size="12">[1, 2, 3].map { |n|</text>
        <text x="742" y="317" fill="#f8f3ed" font-family="Menlo, Consolas, monospace" font-size="12">  n * 2</text>
        <text x="742" y="342" fill="#f8f3ed" font-family="Menlo, Consolas, monospace" font-size="12">}</text>
        <rect x="723" y="456" width="96" height="31" rx="7" fill="#17141f"/>
        <text x="771" y="476" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Run code</text>

        <rect x="931" y="184" width="195" height="320" fill="#211d29"/>
        <line x1="931" y1="184" x2="931" y2="504" stroke="#17141f" stroke-width="3"/>
        <text x="952" y="214" fill="#f8f3ed" font-size="12" font-weight="700">Console</text>
        <rect x="951" y="230" width="155" height="210" rx="10" fill="#151219" stroke="#4a4452"/>
        <text x="968" y="264" fill="#ffac9d" font-family="Menlo, Consolas, monospace" font-size="10">Environment initialized!</text>
        <text x="968" y="292" fill="#ffac9d" font-family="Menlo, Consolas, monospace" font-size="10">Executing script...</text>
        <text x="968" y="320" fill="#d8d0e2" font-family="Menlo, Consolas, monospace" font-size="10">Hello, mruby!</text>
        <text x="968" y="348" fill="#ffac9d" font-family="Menlo, Consolas, monospace" font-size="10">Result: [2, 4, 6]</text>
      </g>
    </g>
  </g>
</svg>
